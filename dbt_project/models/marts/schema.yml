version: 2

models:
  - name: fct_orders
    description: "Tabel fakta pesanan transaksi"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_product_category
    columns:
      - name: product_category
        data_tests:
          - unique
          - not_null

  - name: mart_daily_sales
    description: "Tabel mart daily sales"
    columns:
      - name: order_date
      - name: product_category
      - name: payment_method
      - name: total_orders
      - name: total_gross_sales
      - name: total_net_sales